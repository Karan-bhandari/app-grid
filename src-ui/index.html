<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App Grid</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="overlay-container">
      <!-- Top 28px Control Strip -->
      <header id="control-strip">
        <div class="control-left">
          <button id="btn-new-folder" class="pill-btn" title="Create a new folder">
            + New Folder
          </button>
        </div>
        <div id="pagination-dots" class="control-center"></div>
        <div class="control-right">
          <button
            id="btn-toggle-native"
            class="pill-btn"
            title="Peek at Apple's native Spotlight view"
          >
            Native View
          </button>
        </div>
      </header>

      <!-- Main Grid Viewport -->
      <main id="grid-viewport">
        <div id="pages-container"></div>
      </main>

      <!-- Folder Popover View -->
      <div id="folder-popover" class="hidden">
        <div class="popover-backdrop"></div>
        <div class="popover-content">
          <div class="folder-header">
            <input type="text" id="folder-title-input" spellcheck="false" autocomplete="off" />
            <button id="btn-close-folder" class="popover-close-btn">&times;</button>
          </div>
          <div id="folder-grid" class="folder-grid"></div>
        </div>
      </div>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
