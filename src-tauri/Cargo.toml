[package]
name = "app-grid"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "app-grid"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# Core Windowing & Non-Activating NSPanel
tauri = { version = "2.12", features = ["macos-private-api", "tray-icon", "image-png", "protocol-asset"] }
window-vibrancy = "0.8"

# Native macOS Bindings (AppKit, Foundation, Accessibility, CoreGraphics)
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSArray", "NSDictionary", "NSGeometry", "NSProcessInfo", "NSData", "NSEnumerator", "NSObject", "NSValue", "NSThread"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSApplication", "NSWindow", "NSPanel", "NSScreen", "NSImage", "NSBitmapImageRep", "NSRunningApplication", "NSVisualEffectView", "NSResponder", "NSView", "NSGraphics", "NSImageRep", "NSGraphicsContext"] }
accessibility-sys = "0.2"
core-foundation = "0.10"
core-graphics = "0.25"

# Filesystem, Plist Parsing, Icon Processing & Database
notify = "8.2"
plist = "1.10"
rusqlite = { version = "0.40", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
sha2 = "0.10"

# Serialization & CLI
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
dirs = "7.0"

[dev-dependencies]
tempfile = "3.27"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
